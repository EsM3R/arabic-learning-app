name: APK derle

# Telefona kurulabilir bir Android APK üretir.
# Tetikleme: bu geliştirme dalına push, apk-v* etiketi, veya Actions sekmesinden elle.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/arabic-learning-app-21ab83
    paths-ignore:
      - "**.md"

permissions:
  contents: write

jobs:
  build:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      # Node 22: testler --experimental-strip-types ile koşuyor (22.6+ gerekir).
      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları kur
        run: npm ci

      # Yanlış SDK'nın native modülü ağaca sızarsa gradle derlemesi GEÇER ama
      # uygulama açılışta çöker (NoClassDefFoundError). Burada yakalanmazsa
      # ancak APK telefona kurulunca anlaşılır.
      - name: Native modül sürümlerini doğrula
        run: node scripts/check-native-versions.js

      # Hata ekranı hangi koddan derlendiğimizi gösterebilsin diye derleme
      # kimliği kaynağa gömülür.
      - name: Derleme kimliğini göm
        run: |
          sed -i \
            -e "s/commit: \"gelistirme\"/commit: \"${GITHUB_SHA::7}\"/" \
            -e "s/build: \"yerel\"/build: \"#${{ github.run_number }}\"/" \
            -e "s/date: \"\"/date: \"$(date -u +%Y-%m-%d)\"/" \
            src/buildInfo.ts
          cat src/buildInfo.ts | head -12

      - name: TypeScript denetimi
        run: npx tsc --noEmit

      # İki katman: saf mantık (node --test, saniyeler) ve EKRAN testleri
      # (jest + react-native-testing-library). İkincisi, Akıcılık Odası'ndaki
      # gibi ekranla zamanlayıcı arasındaki dikişte yaşayan hataları tutuyor —
      # saf testler onu yakalayamıyordu.
      - name: Testler
        run: npm test

      # app.json tek doğruluk kaynağı; android/ klasörü repoda tutulmaz,
      # her derlemede prebuild ile yeniden üretilir (Expo CNG).
      - name: Android projesini üret (prebuild)
        run: npx expo prebuild --platform android --no-install

      # Şablonun ürettiği anahtarı değil, repoda sabitlenmiş olanı kullan:
      # imza her derlemede aynı kalsın ki APK'lar birbirinin üstüne
      # güncelleme olarak kurulabilsin (yoksa uygulamayı silip yeniden
      # kurmak gerekir ve öğrenme verisi kaybolur).
      - name: İmzalama anahtarını sabitle
        run: |
          cp .ci/debug.keystore android/app/debug.keystore
          echo "Anahtar SHA256:"
          sha256sum android/app/debug.keystore

      # Her derleme bir öncekinin üstüne güncelleme olarak kurulabilsin diye
      # versionCode'u derleme numarasıyla artır (app.json'daki değer taban).
      - name: Sürüm numarasını artır
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle

      - name: Gradle belleğini artır
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
            echo "org.gradle.daemon=false"
          } >> android/gradle.properties

      - name: APK derle
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --stacktrace

      - name: APK'yı adlandır ve doğrula
        id: apk
        run: |
          set -euo pipefail
          SRC=android/app/build/outputs/apk/release/app-release.apk
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="lisan-hocasi-${VERSION}-${GITHUB_SHA::7}.apk"
          mkdir -p out
          cp "$SRC" "out/${NAME}"
          # Kalıcı indirme linki hep aynı kalsın diye sabit adlı kopya
          cp "$SRC" "out/lisan-hocasi.apk"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$SRC" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "### 📦 ${NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "Boyut: $(du -h "out/${NAME}" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then
            echo "İmza:" >> "$GITHUB_STEP_SUMMARY"
            "$APKSIGNER" verify --print-certs "out/${NAME}" \
              | grep -i "SHA-256 digest" >> "$GITHUB_STEP_SUMMARY" || true
          fi

      # Artifact yalnızca kısa süreli bir güvenlik ağıdır; ASIL teslim aşağıdaki
      # release'tir (indirme adresi sabit ve Actions kotasına yazılmaz).
      #
      # Derleme #33 bu adımda öldü: 90 günlük saklama × ~38 MB × onlarca derleme
      # Actions depolama kotasını doldurdu ve release adımı hiç çalışamadı.
      # İki ders: saklama 3 güne indirildi ve adım artık işi ÖLDÜRMÜYOR —
      # kota dolsa bile APK release'e çıkar.
      - name: APK'yı yükle (artifact)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: lisan-hocasi-apk
          path: out/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 3

      # Kalıcı ve telefondan tek dokunuşla indirilebilir sürüm. Etiket hep aynı
      # ("apk-latest") olduğu için indirme adresi de sabit kalır:
      # .../releases/latest/download/lisan-hocasi.apk
      #
      # Release'i ASLA silip yeniden kurmuyoruz. Eskiden öyle yapılıyordu ve
      # yükleme düşünce (uploads.github.com HTTP 400) gh, az önce açtığı
      # release'i geri sildiği için ortada indirilebilir hiçbir APK kalmıyordu.
      # Artık release yerinde güncelleniyor: yeni yükleme başarısız olsa bile
      # bir önceki çalışan APK indirilebilir durumda kalır.
      - name: Sürümü yayınla (release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=apk-latest
          TITLE="Lisan Hocası ${{ steps.apk.outputs.version }} (derleme #${{ github.run_number }})"
          {
            echo "Android APK · ${{ steps.apk.outputs.size }} · commit \`${GITHUB_SHA::7}\` · derleme #${{ github.run_number }}"
            echo
            echo "**Telefona kurmak için:** \`lisan-hocasi.apk\` dosyasını indir ve aç."
            echo "Android \"bilinmeyen kaynak\" uyarısı verirse tarayıcına kurulum izni ver."
            echo
            echo "Bu dosya her derlemede aynı anahtarla imzalanır; yeni sürümü eskisinin"
            echo "üstüne kurabilirsin, öğrenme verilerin korunur."
          } > release-notes.md

          # Etiketi bu commit'e taşı (release adı sabit kaldığı için indirme
          # adresi değişmez, ama etiket artık doğru koda işaret eder).
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" --title "$TITLE" --notes-file release-notes.md --latest
          fi

          # Yükleme ağ kaynaklı düşebiliyor; tek deneme yetmiyor.
          ok=""
          for attempt in 1 2 3 4; do
            if gh release upload "$TAG" "out/lisan-hocasi.apk" --clobber; then
              ok=1
              break
            fi
            echo "Yükleme başarısız (deneme ${attempt}/4), bekleniyor..."
            sleep $((attempt * 20))
          done
          if [ -z "$ok" ]; then
            echo "::error::APK release'e yüklenemedi. Artifact üzerinden indirilebilir."
            exit 1
          fi
          echo "İndirme: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/lisan-hocasi.apk" >> "$GITHUB_STEP_SUMMARY"
